# The orphan-tagger watcher: RBAC + Deployment. Same RBAC as production.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orphan-tagger
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orphan-tagger:finalizer-patcher
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orphan-tagger:finalizer-patcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orphan-tagger:finalizer-patcher
subjects:
  - kind: ServiceAccount
    name: orphan-tagger
    namespace: crossplane-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orphan-tagger-watcher
  namespace: crossplane-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: orphan-tagger-watcher}
  template:
    metadata:
      labels: {app: orphan-tagger-watcher}
    spec:
      serviceAccountName: orphan-tagger
      containers:
        - name: watcher
          image: orphan-tagger-watcher:demo   # built locally by `make up`
          imagePullPolicy: Never
          args: ["--poll-interval=5s"]        # production default is 30s
          env:
            # The only difference from production: AWS calls go to moto.
            - {name: AWS_ENDPOINT_URL, value: "http://moto.aws-mock.svc:5000"}
            - {name: AWS_ACCESS_KEY_ID, value: test}
            - {name: AWS_SECRET_ACCESS_KEY, value: test}
            - {name: AWS_REGION, value: us-east-1}
          ports:
            - {containerPort: 8080, name: metrics}
